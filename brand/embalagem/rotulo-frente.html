<!doctype html>
<html lang="pt-BR"><meta charset="utf-8">
<title>Rótulo frente · Meldê Original 250 g</title>
<style>
@font-face{font-family:Archivo;src:url(../../assets/fonts/archivo-latin.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
:root{--marrom:#30251E;--mel:#E5A52A}
*{margin:0;box-sizing:border-box}
html,body{width:1054px;height:400px;background:#fff;overflow:hidden}
.rotulo{position:relative;width:1054px;height:400px;padding:46px 58px 40px 64px;color:var(--marrom);font-family:Archivo,sans-serif;display:grid;grid-template-columns:600px 1fr;grid-template-rows:1fr auto;column-gap:40px}
.marca{align-self:start;width:600px;margin-top:-6px}
.marca svg{display:block;width:100%;height:auto}
.desc{align-self:center;display:flex;flex-direction:column;gap:10px;padding-top:18px}
.linha{font-stretch:125%;font-weight:800;font-size:27px;letter-spacing:.16em;text-transform:uppercase}
.tipo{font-weight:500;font-size:34px;letter-spacing:-.01em}
.base{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--mel);padding-top:16px;font-stretch:125%;font-weight:800;font-size:30px;letter-spacing:.08em;text-transform:uppercase}
.base span:last-child{letter-spacing:.02em;text-transform:none}
</style>
<div class="rotulo">
  <div class="marca"><svg viewBox="-8 36 524 176" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="meldê"><path d="M12 188V142a30 30 0 0 1 60 0v46M72 142a30 30 0 0 1 60 0v46 M166 146H241.79A38 38 0 1 0 225.80 181.13 M276 56v132 M310 150a38 38 0 1 0 76 0a38 38 0 1 0-76 0 M386 56v132 M420 146H495.79A38 38 0 1 0 479.80 181.13" stroke="#30251E" stroke-width="24"/><path d="M424 75l34-19.6 34 19.6" stroke="#E5A52A" stroke-width="22"/></svg></div>
  <div class="desc"><span class="linha">Original</span><span class="tipo">mel cremoso</span></div>
  <div class="base"><span>100% mel</span><span>250 g</span></div>
</div>
</html>
